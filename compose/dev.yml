# Development compose configuration
# Builds from local source code
#
# Usage:
#   docker compose -f compose/dev.yml up -d --build
#   docker compose -f compose/dev.yml down

name: traindash-dev

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: trainingdash
      POSTGRES_PASSWORD: trainingdash
      POSTGRES_DB: trainingdash
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainingdash"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://trainingdash:trainingdash@db:5432/trainingdash
      SECRET_KEY: dev-secret-change-me
      ADMIN_PASSWORD: admin
      TRAININGDASH_ENCRYPTION_KEY: D1prO+2rx2zmauRYJc8yKA2rbW0ABdAo5uf8ZJMoXSQ=
      TRAININGDASH_UPLOADS_DIR: /app/uploads
    volumes:
      - tilecache:/app/tile-cache
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python -m trainingdash.init_db && uvicorn trainingdash.app:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://trainingdash:trainingdash@db:5432/trainingdash
      SECRET_KEY: dev-secret-change-me
      TRAININGDASH_ENCRYPTION_KEY: D1prO+2rx2zmauRYJc8yKA2rbW0ABdAo5uf8ZJMoXSQ=
      TRAININGDASH_UPLOADS_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
      - backups:/data/backups
    depends_on:
      db:
        condition: service_healthy
    command: saq trainingdash.worker.settings

volumes:
  pgdata:
  tilecache:
  uploads:
  backups:
