# E2E testing compose configuration
# Uses port 8001 to avoid conflicts with dev environment (8000)
# Fresh DB each run (no persistent volume)
#
# Usage:
#   docker compose -f compose/e2e.yml up -d --build
#   docker compose -f compose/e2e.yml down -v

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: trainingdash_e2e
      POSTGRES_PASSWORD: trainingdash_e2e
      POSTGRES_DB: trainingdash_e2e
    # No volume - fresh DB each run
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainingdash_e2e"]
      interval: 2s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "8001:8000"
    restart: on-failure:5
    environment:
      DATABASE_URL: postgresql+asyncpg://trainingdash_e2e:trainingdash_e2e@db:5432/trainingdash_e2e
      SECRET_KEY: e2e-test-secret-key
      ADMIN_PASSWORD: admin
      TRAININGDASH_ENCRYPTION_KEY: D1prO+2rx2zmauRYJc8yKA2rbW0ABdAo5uf8ZJMoXSQ=
      MOCK_XERT_ENABLED: "true"
      MOCK_XERT_FIXTURES_DIR: /app/e2e-fixtures/fit-files
    volumes:
      - e2e-tilecache:/app/tile-cache
      - ../frontend/e2e/fixtures:/app/e2e-fixtures:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    command: sh -c "python -m trainingdash.init_db && uvicorn trainingdash.app:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://trainingdash_e2e:trainingdash_e2e@db:5432/trainingdash_e2e
      SECRET_KEY: e2e-test-secret-key
      TRAININGDASH_ENCRYPTION_KEY: D1prO+2rx2zmauRYJc8yKA2rbW0ABdAo5uf8ZJMoXSQ=
      MOCK_XERT_ENABLED: "true"
      MOCK_XERT_FIXTURES_DIR: /app/e2e-fixtures/fit-files
    volumes:
      - ../frontend/e2e/fixtures:/app/e2e-fixtures:ro
    depends_on:
      db:
        condition: service_healthy
    command: saq trainingdash.worker.settings

volumes:
  e2e-tilecache:
