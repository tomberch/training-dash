services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: fitter
      POSTGRES_PASSWORD: fitter
      POSTGRES_DB: fitter
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitter"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://fitter:fitter@db:5432/fitter
      SECRET_KEY: dev-secret-change-me
      ADMIN_PASSWORD: admin
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python -m fitter.init_db && uvicorn fitter.app:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - app

volumes:
  pgdata: