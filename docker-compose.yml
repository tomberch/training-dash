services:
  db:
    image: postgis/postgis:16-3.4
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: trainingdash
      POSTGRES_PASSWORD: trainingdash
      POSTGRES_DB: trainingdash
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainingdash"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://trainingdash:trainingdash@db:5432/trainingdash
      SECRET_KEY: dev-secret-change-me
      ADMIN_PASSWORD: admin
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      TRAININGDASH_ENCRYPTION_KEY: D1prO+2rx2zmauRYJc8yKA2rbW0ABdAo5uf8ZJMoXSQ=
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -c "python -m trainingdash.init_db && uvicorn trainingdash.app:app --host 0.0.0.0 --port 8000"

  worker:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://trainingdash:trainingdash@db:5432/trainingdash
      SECRET_KEY: dev-secret-change-me
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      TRAININGDASH_ENCRYPTION_KEY: D1prO+2rx2zmauRYJc8yKA2rbW0ABdAo5uf8ZJMoXSQ=
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: arq trainingdash.worker.WorkerSettings

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - app

volumes:
  pgdata: