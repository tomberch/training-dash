# Ruff configuration for trainingdash backend
# https://docs.astral.sh/ruff/configuration/

target-version = "py312"
line-length = 120

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "S",      # flake8-bandit (security)
    "RUF",    # Ruff-specific rules
]

ignore = [
    "E501",   # line too long (handled by formatter)
    "S101",   # assert used (fine in tests)
    "B008",   # function call in default argument (needed for FastAPI Depends)
    "SIM102", # nested if - sometimes clearer to keep separate
    "SIM117", # nested with - sometimes clearer with comments between
    "SIM108", # ternary operator - if/else often clearer
    "RUF002", # ambiguous unicode - using × in formulas is fine
    "RUF003", # ambiguous unicode in comments
    "RUF046", # int(round()) - explicit is fine
    "UP046",  # Generic subclass - existing code pattern
    "B905",   # zip strict - not always needed
    "B904",   # raise from - existing pattern
    "B007",   # unused loop variable - sometimes intentional
    "E402",   # import order - sometimes needed for circular imports
    "RUF059", # unused unpacked variable
    "RUF005", # list concatenation - explicit is clearer
    "RUF012", # mutable class attribute - test fixtures
    "F841",   # unused variable - will clean up incrementally
    "W291",   # trailing whitespace in SQL strings
    "E712",   # == True needed for SQLAlchemy boolean filters
]

[lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",   # assert is fine in tests
    "S105",   # hardcoded passwords in tests are fine
    "S106",   # hardcoded passwords in tests are fine
    "S603",   # subprocess in tests is fine
    "S607",   # partial path in tests is fine
    "S110",   # try-except-pass in test fixtures
]
"migrations/**/*.py" = [
    "E501",   # migrations can have long lines
    "E402",   # import order doesn't matter in migrations
    "W291",   # trailing whitespace (auto-generated)
    "W293",   # blank line whitespace (auto-generated)
]
"debug_*.py" = [
    "SIM102", # nested if is fine in debug scripts
]
"src/trainingdash/init_db.py" = [
    "S607",   # alembic must be called by name
]
"src/trainingdash/integrations/xert/client.py" = [
    "S105",   # CLIENT_SECRET is a public API constant, not a real secret
]
"src/trainingdash/integrations/xert/mock_client.py" = [
    "S105",   # mock password checks
]
"src/trainingdash/route_matching.py" = [
    "S608",   # SQL is safe - simplified_expr is built from constants, not user input
]

[format]
quote-style = "double"
indent-style = "space"
