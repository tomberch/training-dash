[project]
name = "trainingdash-backend"
version = "0.1.0"
description = "Self-hosted fitness analysis backend"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "asyncpg>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "geoalchemy2>=0.17",
    "pydantic>=2.0",
    "email-validator>=2.0",
    "fit-tool>=0.9",
    "garmin-fit-sdk>=21.0",
    "python-multipart>=0.0.20",
    "bcrypt>=4.0",
    "itsdangerous>=2.1",
    "saq[postgres]>=0.24.0",
    "cryptography>=50.0.0",
    "httpx>=0.28",
    "garminconnect>=0.2.25",
    "curl-cffi>=0.9",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pillow>=11.0",
    "fastapi-sso>=0.19.0",
    "lark>=1.2",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "testcontainers>=4.10",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trainingdash"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = ["--durations=10"]
markers = [
    "slow: marks tests as slow (>5s) - deselect with '-m \"not slow\"'",
]

[tool.coverage.run]
# Use Python 3.12+ sys.monitoring for faster coverage (34% less CPU overhead)
core = "sysmon"

[dependency-groups]
dev = [
    "docker>=7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-json-report>=1.5.0",
    "pytest-xdist>=3.8.0",
    "python-dotenv>=1.2.2",
    "ruff>=0.16.0",
    "testcontainers>=4.15.0",
]
