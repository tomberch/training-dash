[project]
name = "fitter-backend"
version = "0.1.0"
description = "Self-hosted fitness analysis backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "asyncpg>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "geoalchemy2>=0.17",
    "pydantic>=2.0",
    "fit-tool>=0.2",
    "python-multipart>=0.0.20",
    "bcrypt>=4.0",
    "itsdangerous>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "testcontainers>=4.10",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fitter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]