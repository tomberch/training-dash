[project]
name = "trainingdash-backend"
version = "0.1.0"
description = "Self-hosted fitness analysis backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "asyncpg>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "geoalchemy2>=0.17",
    "pydantic>=2.0",
    "fit-tool>=0.2",
    "fitdecode>=0.10",
    "python-multipart>=0.0.20",
    "bcrypt>=4.0",
    "itsdangerous>=2.1",
    "arq>=0.28.0",
    "redis>=5.3.1",
    "cryptography>=50.0.0",
    "httpx>=0.28",
    "garminconnect>=0.2.25",
    "curl-cffi>=0.7",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "scipy>=1.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "testcontainers>=4.10",
    "httpx>=0.28",
    "redis>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trainingdash"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["--durations=10"]

[tool.coverage.run]
# Use Python 3.12+ sys.monitoring for faster coverage (34% less CPU overhead)
core = "sysmon"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "python-dotenv>=1.2.2",
    "testcontainers>=4.15.0",
]
