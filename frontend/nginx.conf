proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:10m max_size=1g inactive=30d use_temp_path=off;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # OSM tile proxy with caching
    location /tiles/ {
        proxy_pass https://tile.openstreetmap.org/;
        proxy_cache tiles;
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_set_header Host tile.openstreetmap.org;
        proxy_set_header User-Agent "TrainingDash fitness app (personal use)";
        proxy_ssl_server_name on;
        add_header X-Cache-Status $upstream_cache_status;
        expires 30d;
    }

    # API endpoints - proxy to backend only for XHR/fetch requests (Accept: application/json)
    # or when not requesting HTML
    location ~ ^/(login|logout|me|upload|activities|records|jobs|admin|pmc|power-curve|fitness)(/|$) {
        # If browser navigation (Accept header contains text/html), serve SPA
        if ($http_accept ~* "text/html") {
            rewrite ^ /index.html last;
        }
        
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback - serve index.html for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
