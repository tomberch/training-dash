name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Playwright dependencies (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Start Docker Compose stack
        run: |
          docker compose -f docker-compose.e2e.yml up -d --build
          # Wait for app to be healthy
          timeout 120 bash -c 'until curl -sf http://localhost:8001/api/health; do sleep 2; done'

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test --project=setup --project=chromium --project=chromium-no-auth
        env:
          CI: true

      - name: Generate test summary
        if: always()
        working-directory: frontend
        run: |
          echo "## :performing_arts: E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          node scripts/format-test-summary.js >> $GITHUB_STEP_SUMMARY || echo "No results to summarize" >> $GITHUB_STEP_SUMMARY

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: frontend/e2e-report/
          retention-days: 14

      - name: Upload test artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/e2e-results/
          retention-days: 7

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
