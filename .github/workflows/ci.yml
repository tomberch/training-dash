name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly CodeQL scan on Sundays at 4am UTC
    - cron: '0 4 * * 0'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Opt into Node 24 for actions (silences deprecation warning)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  lint-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Check formatting with Ruff
        run: uv run ruff format --check .

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: error

  test-backend-unit:
    runs-on: ubuntu-latest
    needs: [lint-backend]
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --dev

      - name: Run unit tests
        run: uv run pytest tests/unit/ --tb=short -q --cov=trainingdash --cov-report=json --cov-report=term --json-report --json-report-file=test-results.json

      - name: Generate test summary
        if: always()
        run: |
          echo "## :snake: Backend Unit Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python -c "
          import json
          from pathlib import Path

          filepath = 'test-results.json'
          if not Path(filepath).exists():
              print('No results found.')
          else:
              with open(filepath) as f:
                  data = json.load(f)
              
              summary = data.get('summary', {})
              passed = summary.get('passed', 0)
              failed = summary.get('failed', 0)
              skipped = summary.get('skipped', 0)
              total = summary.get('total', passed + failed + skipped)
              duration = data.get('duration', 0)
              
              print('| Passed | Failed | Skipped | Total | Duration |')
              print('|--------|--------|---------|-------|----------|')
              print(f'| {passed} | {failed} | {skipped} | {total} | {duration:.1f}s |')
              
              if failed > 0:
                  print('')
                  print('**Failed tests:**')
                  for test in data.get('tests', []):
                      if test.get('outcome') == 'failed':
                          print(f'- {test[\"nodeid\"]}')
          " >> $GITHUB_STEP_SUMMARY

      - name: Generate coverage summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Coverage" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage.json ]; then
            python -c "
          import json
          with open('coverage.json') as f:
              data = json.load(f)
          totals = data['totals']
          print('| Lines | Covered |')
          print('|-------|---------|')
          print(f'| {totals[\"percent_covered\"]:.1f}% | {totals[\"covered_lines\"]} / {totals[\"num_statements\"]} |')
          " >> $GITHUB_STEP_SUMMARY
          else
            echo "No coverage data found" >> $GITHUB_STEP_SUMMARY
          fi

  test-backend-integration:
    runs-on: ubuntu-latest
    needs: [lint-backend]
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --dev

      - name: Run integration tests
        run: uv run pytest tests/integration/ --tb=short -q --json-report --json-report-file=test-results.json
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY || 'dGVzdC1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcw==' }}

      - name: Generate test summary
        if: always()
        run: |
          echo "## :snake: Backend Integration Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python -c "
          import json
          from pathlib import Path

          filepath = 'test-results.json'
          if not Path(filepath).exists():
              print('No results found.')
          else:
              with open(filepath) as f:
                  data = json.load(f)
              
              summary = data.get('summary', {})
              passed = summary.get('passed', 0)
              failed = summary.get('failed', 0)
              skipped = summary.get('skipped', 0)
              total = summary.get('total', passed + failed + skipped)
              duration = data.get('duration', 0)
              
              print('| Passed | Failed | Skipped | Total | Duration |')
              print('|--------|--------|---------|-------|----------|')
              print(f'| {passed} | {failed} | {skipped} | {total} | {duration:.1f}s |')
              
              if failed > 0:
                  print('')
                  print('**Failed tests:**')
                  for test in data.get('tests', []):
                      if test.get('outcome') == 'failed':
                          print(f'- {test[\"nodeid\"]}')
          " >> $GITHUB_STEP_SUMMARY

  lint-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  test-frontend:
    runs-on: ubuntu-latest
    needs: [lint-frontend]
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test -- --coverage

      - name: Generate coverage summary
        if: always()
        run: |
          echo "## :test_tube: Frontend Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const c = require('./coverage/coverage-summary.json').total;
              const fmt = (m) => m.pct.toFixed(1) + '%';
              console.log('| Lines | Statements | Functions | Branches |');
              console.log('|-------|------------|-----------|----------|');
              console.log('| ' + fmt(c.lines) + ' | ' + fmt(c.statements) + ' | ' + fmt(c.functions) + ' | ' + fmt(c.branches) + ' |');
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "No coverage data found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [test-backend-unit, test-backend-integration, test-frontend]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Playwright dependencies (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Start Docker Compose stack
        run: |
          docker compose -f compose/e2e.yml up -d --build
          timeout 120 bash -c 'until curl -sf http://localhost:8001/api/health; do sleep 2; done'

      - name: Dump container logs (on startup failure)
        if: failure()
        run: |
          echo "=== Docker container status ==="
          docker compose -f compose/e2e.yml ps -a
          echo ""
          echo "=== App container logs ==="
          docker compose -f compose/e2e.yml logs app --tail=100
          echo ""
          echo "=== DB container logs ==="
          docker compose -f compose/e2e.yml logs db --tail=50

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test --project=setup --project=chromium --project=chromium-no-auth
        env:
          CI: true

      - name: Generate test summary
        if: always()
        working-directory: frontend
        run: |
          echo "## :performing_arts: E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          node scripts/format-test-summary.js >> $GITHUB_STEP_SUMMARY || echo "No results to summarize" >> $GITHUB_STEP_SUMMARY

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-html-report
          path: frontend/e2e-report/
          retention-days: 14

      - name: Upload test artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: frontend/e2e-results/
          retention-days: 7

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose -f compose/e2e.yml down -v

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          category: "/language:${{ matrix.language }}"

  build-and-push:
    runs-on: ubuntu-latest
    needs: [e2e, codeql]
    # Build on every push to main (edge) or on version tags (release),
    # or when manually dispatched (e.g. to re-run Trivy against a freshly pinned image)
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # For pushes to main: tag as 'edge'
            type=raw,value=edge,enable={{is_default_branch}}
            # For tags: use the tag value (e.g., v1.0.0 -> 1.0.0)
            type=semver,pattern={{version}}
            # For tags: also tag as 'latest'
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build Docker image (for scanning)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan
          cache-from: type=gha

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cleanup-images:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      packages: write

    steps:
      - name: Prune old edge images
        uses: vlaurin/action-ghcr-prune@v0.6.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          container: training-dash
          dry-run: false
          keep-last: 1
          keep-tags-regexes: |
            ^v?\d+\.\d+\.\d+
            ^latest$
          prune-tags-regexes: |
            ^edge$

  release:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create/update edge release (main branch)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete existing edge release if it exists
          gh release delete edge --yes 2>/dev/null || true
          
          # Delete existing edge tag if it exists
          git push origin :refs/tags/edge 2>/dev/null || true
          
          # Create new edge release
          gh release create edge \
            --title "Edge (latest main)" \
            --notes "Rolling release tracking the latest commit on main.

          **Commit:** ${{ github.sha }}
          **Date:** $(date -u +%Y-%m-%dT%H:%M:%SZ)

          > ⚠️ This is a pre-release build from the main branch. Use versioned releases for production.

          ## Docker Image
          \`\`\`
          docker pull ghcr.io/${{ github.repository }}:edge
          \`\`\`" \
            --prerelease \
            --target ${{ github.sha }}

      - name: Create version release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            --latest
