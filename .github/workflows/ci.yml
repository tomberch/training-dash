name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  schedule:
    # Weekly CodeQL scan on Sundays at 4am UTC
    - cron: '0 4 * * 0'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Opt into Node 24 for actions (silences deprecation warning)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@4901385134134e04cec5fbe5ddfe3b2c5bd5d976 # v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  lint-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Check formatting with Ruff
        run: uv run ruff format --check .

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: error

  test-backend-unit:
    runs-on: ubuntu-latest
    needs: [lint-backend]
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Run unit tests
        run: uv run pytest tests/unit/ --tb=short -q --cov=trainingdash --cov-report=json --cov-report=term --json-report --json-report-file=test-results.json

      - name: Generate test summary
        if: always()
        run: |
          echo "## :snake: Backend Unit Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python -c "
          import json
          from pathlib import Path

          filepath = 'test-results.json'
          if not Path(filepath).exists():
              print('No results found.')
          else:
              with open(filepath) as f:
                  data = json.load(f)
              
              summary = data.get('summary', {})
              passed = summary.get('passed', 0)
              failed = summary.get('failed', 0)
              skipped = summary.get('skipped', 0)
              total = summary.get('total', passed + failed + skipped)
              duration = data.get('duration', 0)
              
              print('| Passed | Failed | Skipped | Total | Duration |')
              print('|--------|--------|---------|-------|----------|')
              print(f'| {passed} | {failed} | {skipped} | {total} | {duration:.1f}s |')
              
              if failed > 0:
                  print('')
                  print('**Failed tests:**')
                  for test in data.get('tests', []):
                      if test.get('outcome') == 'failed':
                          print(f'- {test[\"nodeid\"]}')
          " >> $GITHUB_STEP_SUMMARY

      - name: Generate coverage summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Coverage" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage.json ]; then
            python -c "
          import json
          with open('coverage.json') as f:
              data = json.load(f)
          totals = data['totals']
          print('| Lines | Covered |')
          print('|-------|---------|')
          print(f'| {totals[\"percent_covered\"]:.1f}% | {totals[\"covered_lines\"]} / {totals[\"num_statements\"]} |')
          " >> $GITHUB_STEP_SUMMARY
          else
            echo "No coverage data found" >> $GITHUB_STEP_SUMMARY
          fi

  test-backend-integration:
    runs-on: ubuntu-latest
    needs: [lint-backend]
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Run integration tests
        run: uv run pytest tests/integration/ --tb=short -q --json-report --json-report-file=test-results.json
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY || 'dGVzdC1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcw==' }}

      - name: Generate test summary
        if: always()
        run: |
          echo "## :snake: Backend Integration Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python -c "
          import json
          from pathlib import Path

          filepath = 'test-results.json'
          if not Path(filepath).exists():
              print('No results found.')
          else:
              with open(filepath) as f:
                  data = json.load(f)
              
              summary = data.get('summary', {})
              passed = summary.get('passed', 0)
              failed = summary.get('failed', 0)
              skipped = summary.get('skipped', 0)
              total = summary.get('total', passed + failed + skipped)
              duration = data.get('duration', 0)
              
              print('| Passed | Failed | Skipped | Total | Duration |')
              print('|--------|--------|---------|-------|----------|')
              print(f'| {passed} | {failed} | {skipped} | {total} | {duration:.1f}s |')
              
              if failed > 0:
                  print('')
                  print('**Failed tests:**')
                  for test in data.get('tests', []):
                      if test.get('outcome') == 'failed':
                          print(f'- {test[\"nodeid\"]}')
          " >> $GITHUB_STEP_SUMMARY

  lint-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  test-frontend:
    runs-on: ubuntu-latest
    needs: [lint-frontend]
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test -- --coverage

      - name: Generate coverage summary
        if: always()
        run: |
          echo "## :test_tube: Frontend Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const c = require('./coverage/coverage-summary.json').total;
              const fmt = (m) => m.pct.toFixed(1) + '%';
              console.log('| Lines | Statements | Functions | Branches |');
              console.log('|-------|------------|-----------|----------|');
              console.log('| ' + fmt(c.lines) + ' | ' + fmt(c.statements) + ' | ' + fmt(c.functions) + ' | ' + fmt(c.branches) + ' |');
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "No coverage data found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [test-backend-unit, test-backend-integration, test-frontend]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Playwright dependencies (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Start Docker Compose stack
        run: |
          docker compose -f compose/e2e.yml up -d --build
          timeout 120 bash -c 'until curl -sf http://localhost:8001/api/health; do sleep 2; done'

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test --project=setup --project=chromium --project=chromium-no-auth
        env:
          CI: true

      - name: Generate test summary
        if: always()
        working-directory: frontend
        run: |
          echo "## :performing_arts: E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          node scripts/format-test-summary.js >> $GITHUB_STEP_SUMMARY || echo "No results to summarize" >> $GITHUB_STEP_SUMMARY

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-html-report
          path: frontend/e2e-report/
          retention-days: 14

      - name: Upload test artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: frontend/e2e-results/
          retention-days: 7

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose -f compose/e2e.yml down -v

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@c4dd10e44af883a891fe31ced449bcb4a6728b9b # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e # v3
        with:
          category: "/language:${{ matrix.language }}"

  build-and-push:
    runs-on: ubuntu-latest
    needs: [e2e, codeql]
    # Build on every push to main (edge) or on version tags (release)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # For pushes to main: tag as 'edge'
            type=raw,value=edge,enable={{is_default_branch}}
            # For tags: use the tag value (e.g., v1.0.0 -> 1.0.0)
            type=semver,pattern={{version}}
            # For tags: also tag as 'latest'
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker image (for scanning)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan
          cache-from: type=gha

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956 # master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e # v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
