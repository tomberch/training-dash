name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Opt into Node 24 for actions (silences deprecation warning)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Check formatting with Ruff
        run: uv run ruff format --check .

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: error

      - name: Run unit tests (fast, fail fast)
        run: uv run pytest tests/unit/ --tb=short -q --cov=trainingdash --cov-report= --json-report --json-report-file=unit-results.json

      - name: Run integration tests
        run: uv run pytest tests/integration/ --tb=short -q --cov=trainingdash --cov-append --cov-report=json --cov-report=term --json-report --json-report-file=integration-results.json
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY || 'dGVzdC1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcw==' }}

      - name: Generate test summary
        if: always()
        run: |
          echo "## :snake: Python Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python -c "
          import json
          from pathlib import Path

          def summarize(name, filepath):
              if not Path(filepath).exists():
                  return f'### {name}\nNo results found.\n'
              
              with open(filepath) as f:
                  data = json.load(f)
              
              summary = data.get('summary', {})
              passed = summary.get('passed', 0)
              failed = summary.get('failed', 0)
              skipped = summary.get('skipped', 0)
              total = summary.get('total', passed + failed + skipped)
              duration = data.get('duration', 0)
              
              status = ':white_check_mark: Passed' if failed == 0 else f':x: {failed} Failed'
              
              lines = [f'### {name}', '', '| Passed | Failed | Skipped | Total | Duration |',
                       '|--------|--------|---------|-------|----------|',
                       f'| {passed} | {failed} | {skipped} | {total} | {duration:.1f}s |', '']
              
              # List failed tests
              if failed > 0:
                  lines.append('**Failed tests:**')
                  for test in data.get('tests', []):
                      if test.get('outcome') == 'failed':
                          lines.append(f'- {test[\"nodeid\"]}')
                  lines.append('')
              
              return '\n'.join(lines)

          print(summarize('Unit Tests', 'unit-results.json'))
          print(summarize('Integration Tests', 'integration-results.json'))
          " >> $GITHUB_STEP_SUMMARY

      - name: Generate coverage summary
        if: always()
        run: |
          echo "## :snake: Python Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage.json ]; then
            python -c "
          import json
          with open('coverage.json') as f:
              data = json.load(f)
          totals = data['totals']
          print('| Metric | Coverage |')
          print('|--------|----------|')
          print(f'| Lines | {totals[\"percent_covered\"]:.1f}% |')
          print(f'| Covered | {totals[\"covered_lines\"]} / {totals[\"num_statements\"]} |')
          " >> $GITHUB_STEP_SUMMARY
          else
            echo "No coverage data found" >> $GITHUB_STEP_SUMMARY
          fi

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm test -- --coverage

      - name: Generate coverage summary
        if: always()
        run: |
          echo "## :test_tube: Vitest Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const c = require('./coverage/coverage-summary.json').total;
              const fmt = (m) => m.pct.toFixed(1) + '%';
              console.log('| Metric | Coverage |');
              console.log('|--------|----------|');
              console.log('| Lines | ' + fmt(c.lines) + ' |');
              console.log('| Statements | ' + fmt(c.statements) + ' |');
              console.log('| Functions | ' + fmt(c.functions) + ' |');
              console.log('| Branches | ' + fmt(c.branches) + ' |');
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "No coverage data found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Playwright dependencies (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Start Docker Compose stack
        run: |
          docker compose -f compose/e2e.yml up -d --build
          timeout 120 bash -c 'until curl -sf http://localhost:8001/api/health; do sleep 2; done'

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test --project=setup --project=chromium --project=chromium-no-auth
        env:
          CI: true

      - name: Generate test summary
        if: always()
        working-directory: frontend
        run: |
          echo "## :performing_arts: E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          node scripts/format-test-summary.js >> $GITHUB_STEP_SUMMARY || echo "No results to summarize" >> $GITHUB_STEP_SUMMARY

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-html-report
          path: frontend/e2e-report/
          retention-days: 14

      - name: Upload test artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-traces
          path: frontend/e2e-results/
          retention-days: 7

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose -f compose/e2e.yml down -v

  build-and-push:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, e2e]
    # Build on every push to main (edge) or on version tags (release)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # For pushes to main: tag as 'edge'
            type=raw,value=edge,enable={{is_default_branch}}
            # For tags: use the tag value (e.g., v1.0.0 -> 1.0.0)
            type=semver,pattern={{version}}
            # For tags: also tag as 'latest'
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker image (for scanning)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan
          cache-from: type=gha

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956 # master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e # v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
